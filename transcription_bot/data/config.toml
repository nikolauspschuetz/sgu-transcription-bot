# override these settings with env vars, not by editing this file
# see .env.template

local_mode = false

# ---------------------------------------------------------------------------
# Backend selection (which engine performs each stage)
#   transcription_backend: "local_whisper"     free, faster-whisper, CPU (any machine)
#                          "local_mlx_whisper" free, MLX, uses the Apple-Silicon GPU
#                          "azure"             paid, legacy — do not use
#   diarization_backend:   "local_pyannote" (free) | "pyannote_ai" (paid, legacy)
#   llm_backend:           "none" (heuristics only) | "ollama" (free, local) | "openai" (paid, legacy)
# The set of required credentials is derived from these choices (see config.py).
#
# NOTE on Apple Silicon (e.g. the M4 mini): faster-whisper/CTranslate2 has no Metal
# backend, so "local_whisper" is CPU-only there. Use "local_mlx_whisper" to run the GPU.
# pyannote uses PyTorch, which DOES support Apple Silicon via diarization_device="mps".
# ---------------------------------------------------------------------------
transcription_backend = "local_whisper"
diarization_backend = "local_pyannote"
llm_backend = "none"

# --- faster-whisper sizing (transcription_backend = "local_whisper") -------
#   dev (Intel CPU):     model="medium.en" device="cpu" compute_type="int8"
#   Apple Silicon (CPU): model="large-v3"  device="cpu" compute_type="int8"
whisper_model = "medium.en"
whisper_device = "cpu"
whisper_compute_type = "int8"
whisper_beam_size = 5

# --- MLX Whisper repo (transcription_backend = "local_mlx_whisper") --------
# HuggingFace repo of an MLX-converted Whisper model; runs on the Apple GPU.
#   e.g. mlx-community/whisper-large-v3-mlx  |  mlx-community/whisper-medium.en-mlx
mlx_whisper_repo = "mlx-community/whisper-large-v3-mlx"

# --- local diarization (pyannote.audio) ------------------------------------
hf_token = ""                       # HuggingFace token to download gated pyannote models (free)
diarization_pipeline = "pyannote/speaker-diarization-3.1"
diarization_device = "cpu"          # "cpu" | "cuda"
# Directory of reference speaker embeddings for local speaker identification.
# Empty = skip naming; speakers stay as SPEAKER_00.. for human review.
voiceprint_dir = ""

# --- local LLM (ollama) for segment/caption/SoF help -----------------------
ollama_base_url = "http://localhost:11434"
ollama_model = "llama3.1"

# RSS feeds
podcast_rss_url = "https://feed.theskepticsguide.org/feed/rss.aspx?feed=sgu"
wiki_rss_url = "https://www.sgutranscripts.org/w/api.php?hidebots=0&urlversion=1&days=1&limit=500&action=feedrecentchanges&feedformat=rss"

# Wiki
wiki_username = ""
wiki_password = ""
wiki_episode_url_base = "https://www.sgutranscripts.org/w/rest.php/v1/page/SGU_Episode_"
wiki_api_base = "https://sgutranscripts.org/w/api.php"

# Azure / transcription
azure_subscription_key = ""
azure_service_region = ""

# pyannote / diarization
pyannote_token = ""
pyannote_identify_endpoint = "https://api.pyannote.ai/v1/identify"
pyannote_voiceprint_endpoint = "https://api.pyannote.ai/v1/voiceprint"
pyannote_jobs_endpoint = "https://api.pyannote.ai/v1/jobs"

# Local server
ngrok_token = ""
server_port = 23500

# OpenAI / GPT / llm
openai_organization = ""
openai_project = ""
openai_api_key = ""
llm_model = "gpt-4o-mini"

# Sentry (only in deployed)
sentry_dsn = ""
cronitor_api_key = ""
cronitor_job_id = ""
