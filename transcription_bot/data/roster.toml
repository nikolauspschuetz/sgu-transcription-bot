# ---------------------------------------------------------------------------
# SGU identity roster — the cast ("rogues") and guests of the show.
#
# PURPOSE
#   Single source of truth for WHO speaks on the show and how they should be
#   named in transcripts. Drives local speaker naming (issue #5): diarization
#   emits anonymous clusters (SPEAKER_00, SPEAKER_01, ...); we cosine-match each
#   cluster's voice embedding against the reference embedding declared here and
#   relabel it with `display_name`.
#
# SCHEMA (every person — host, rogue, or guest — is one [[member]] block)
#   id                  stable kebab-case slug; NEVER change it once set (keys
#                       reference audio, embeddings, and past corrections).
#   display_name        what appears in the transcript (e.g. "Steve").
#   full_name           real/legal name (e.g. "Steven Novella").
#   role                "host" | "rogue" | "guest"
#   status              "current" | "former" | "guest"
#   active_from         first appearance — ISO date and/or episode number.
#   active_to           last appearance for former members (else omit).
#   aliases             other spellings the ASR/hosts use; helps map spoken
#                       self-introductions ("this is Steven Novella") to `id`.
#   bio                 one-line who-they-are (for docs/ and reviewer context).
#   reference_audio     list of local clip paths (clean, single-speaker) used
#                       to BUILD the reference embedding for #5. Add samples,
#                       re-run the embedder, done.
#   embedding           path to the precomputed reference embedding (.npy).
#                       Empty = not yet enrolled; speaker stays SPEAKER_NN.
#
# EXTENDING TO GUESTS
#   Copy the [[member]] template at the bottom, set role="guest",
#   status="guest", list `guest_episodes`, drop in a reference clip, re-embed.
#   Nothing else in the pipeline needs to change.
# ---------------------------------------------------------------------------

[show]
name = "The Skeptics' Guide to the Universe"
short_name = "SGU"
first_episode_date = "2005-05-04"
society = "New England Skeptical Society (NESS)"
# Fan project. Not affiliated with SGU Productions, LLC.

